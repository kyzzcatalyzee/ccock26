name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: "scheme"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rootless
          - rootful
          - roothide

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: set matrix
        id: set-matrix
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "all" ]; then
            echo 'matrix=["rootless","rootful","roothide"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$SCHEME\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    env:
      DEVICE_TARGET: "iphone:clang:16.5:15.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-src
          git -C sdks-src sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p theos/sdks
          mv sdks-src/iPhoneOS16.5.sdk theos/sdks/
          rm -rf sdks-src

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make dpkg xz
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: build (${{ matrix.scheme }})
        run: |
          SCHEME_FLAG=""
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=rootless"
          elif [ "${{ matrix.scheme }}" = "roothide" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=roothide"
          fi
          make clean
          # Build the .deb with dpkg-deb (Theos' default dm.pl shells out to macOS BSD ar, which can write
          # archive member headers that apt/dpkg on the device reject: "Invalid archive member header").
          command -v dpkg-deb
          make package \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            _THEOS_PLATFORM_DPKG_DEB=dpkg-deb \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz \
            $SCHEME_FLAG

      - name: verify package (${{ matrix.scheme }})
        run: |
          for f in packages/*.deb; do
            echo "== $f"
            ar t "$f"
            dpkg-deb -I "$f" > /dev/null
            python3 - "$f" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          if d[:8] != b'!<arch>\n':
              sys.exit("not an ar archive")
          p = 8
          names = []
          while p < len(d):
              hdr = d[p:p + 60]
              if len(hdr) < 60 or hdr[58:60] != b'`\n':
                  sys.exit("invalid archive member header at %d" % p)
              name = hdr[:16].decode().strip()
              if name.startswith('#1/') or name.startswith('__.SYMDEF') or name.startswith('/'):
                  sys.exit("BSD/GNU extended ar member %r: apt/dpkg on the device cannot read this" % name)
              n = int(hdr[48:58])
              names.append(name)
              p += 60 + n + (n & 1)
          if p != len(d):
              sys.exit("trailing garbage: archive ends at %d but file is %d bytes" % (p, len(d)))
          if not names or names[0] != 'debian-binary':
              sys.exit("first member must be debian-binary, got %r" % names)
          print("members", names)
          print("archive ok", len(d))
          PY
          done

      - name: upload package (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-package
          path: packages/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-packages
          pattern: "*-package"
          merge-multiple: true

      - name: update nightly release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./all-packages/*.deb"
          allowUpdates: true
          tag: nightly
          name: "Nightly"
          body: |
            This build was automatically generated from the latest commit on `main`.

            **Commit SHA:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}

            > [!NOTE]
            > A nightly build is basically the next update partially done. Additionally, this build might have the old version number but the code itself should has the latest commit.
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
